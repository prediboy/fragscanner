<!DOCTYPE html>
<html lang="en" class="dark theme-night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FragSeeker — Fragrance Matcher & Community Sellers Price Engine</title>
    <script>
      if (window.location.hostname === 'fragscanner.vercel.app') {
        window.location.replace('https://www.fragseeker.com' + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              glacier: {
                bg: 'var(--glacier-bg)',
                surface: 'var(--glacier-surface)',
                card: 'var(--glacier-card)',
                subtle: 'var(--glacier-subtle)',
                border: 'var(--glacier-border)',
                borderDark: 'var(--glacier-border-dark)',
                text: 'var(--glacier-text)',
                textMuted: 'var(--glacier-text-muted)',
                accent: 'var(--glacier-accent)',
                accentLight: 'var(--glacier-accent-light)',
                accentDark: '#B45309',
                gold: '#E5A93C',
                success: '#10B981',
                danger: '#EF4444'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              heading: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
      
      :root, [data-theme="fresh"], .theme-fresh {
        --glacier-bg: #F8FAFC;
        --glacier-surface: #FFFFFF;
        --glacier-card: #FFFFFF;
        --glacier-subtle: #F1F5F9;
        --glacier-border: #E2E8F0;
        --glacier-border-dark: #CBD5E1;
        --glacier-text: #0F172A;
        --glacier-text-muted: #64748B;
        --glacier-header: rgba(255, 255, 255, 0.95);
        --glacier-accent: #D97706;
        --glacier-accent-light: #FEF3C7;
      }

      [data-theme="night"], .theme-night, .dark {
        --glacier-bg: #090A0F;
        --glacier-surface: #11131A;
        --glacier-card: #141722;
        --glacier-subtle: #1C202F;
        --glacier-border: #232738;
        --glacier-border-dark: #32374D;
        --glacier-text: #F8FAFC;
        --glacier-text-muted: #94A3B8;
        --glacier-header: rgba(17, 19, 26, 0.95);
        --glacier-accent: #E5A93C;
        --glacier-accent-light: rgba(229, 169, 60, 0.12);
      }

      body {
        background-color: var(--glacier-bg);
        color: var(--glacier-text);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .font-heading {
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      /* Custom clean frosted scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--glacier-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--glacier-border);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--glacier-border-dark);
      }

      /* Refined dark theme text contrast */
      .theme-night .text-glacier-text {
        color: #F8FAFC !important;
      }
      .theme-night .text-glacier-textMuted {
        color: #94A3B8 !important;
      }
      .theme-night .text-slate-900 {
        color: #F8FAFC !important;
      }
      .theme-night .price-rate,
      .dark .price-rate {
        color: #10B981 !important;
        font-weight: 800 !important;
      }
      .theme-night .price-rate-drop,
      .dark .price-rate-drop {
        color: #10B981 !important;
        font-weight: 900 !important;
      }
      .theme-night .text-slate-800 {
        color: #E2E8F0 !important;
      }
      .theme-night .text-slate-700 {
        color: #CBD5E1 !important;
      }
      .theme-night .text-slate-600 {
        color: #94A3B8 !important;
      }
      .theme-night .text-slate-500 {
        color: #64748B !important;
      }

      .theme-night input[type="text"],
      .dark input[type="text"] {
        background-color: #11131A !important;
        color: #F8FAFC !important;
        border-color: #232738 !important;
      }
      .theme-night input[type="text"]::placeholder,
      .dark input[type="text"]::placeholder {
        color: #64748B !important;
      }
      .theme-night select,
      .dark select {
        background-color: #11131A !important;
        color: #F8FAFC !important;
        border-color: #232738 !important;
      }

      .theme-night .shadow-2xs,
      .theme-night .shadow-xs,
      .theme-night .shadow-sm {
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.4) !important;
      }
    </style>
  </head>
  <body class="min-h-screen selection:bg-amber-500/30 selection:text-amber-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
