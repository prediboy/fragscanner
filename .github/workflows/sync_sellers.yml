name: Refresh Community Seller Prices (Every 2 Hours)

on:
  schedule:
    # Runs every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Master Refresh Pipeline across All 6 Sellers
        run: |
          node scripts/refresh_all_sellers.cjs

      - name: Commit and Push Fresh Prices
        run: |
          git config --global user.name "FragScanner Price Bot"
          git config --global user.email "price-bot@fragscanner.app"
          git add src/data/fragrances.json src/data/seller_config.json src/data/sync_meta.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): automated 2-hour price refresh across all 6 community sellers" && git push)
