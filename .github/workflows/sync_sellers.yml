name: Refresh Community Seller Prices (Every 2 Hours)

on:
  schedule:
    # Runs every 2 hours at minute 17 (off-peak minute avoids GitHub top-of-hour queue drop)
    - cron: '17 */2 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Master Refresh Pipeline across All 10 Sellers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/scrape_aar_middle_east.cjs || true
          node scripts/refresh_all_sellers.cjs

      - name: Commit and Push Fresh Prices
        run: |
          git config --global user.name "FragScanner Price Bot"
          git config --global user.email "price-bot@fragscanner.app"
          git add data/fragrances.json data/seller_config.json data/sync_meta.json data/cache_*.json
          if ! git diff --staged --quiet; then
            echo "Changes detected, committing and pushing..."
            git commit -m "chore(sync): automated 2-hour price refresh across all 10 community sellers"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No price or stock changes detected."
          fi
