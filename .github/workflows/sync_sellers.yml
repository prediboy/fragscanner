name: Refresh Community Seller Prices (Hourly Auto-Sync)

on:
  schedule:
    # Runs hourly at minute 25 (hourly schedule prevents 6-8hr gaps when GitHub delays or drops cron events)
    - cron: '25 * * * *'
  workflow_dispatch: # Allows manual or external webhook 1-click trigger anytime

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Run Master Refresh Pipeline across All 10 Sellers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/scrape_aar_middle_east.cjs || true
          node scripts/refresh_all_sellers.cjs
          echo "✓ Successfully refreshed all 10 sellers and synced directly to Supabase!"
