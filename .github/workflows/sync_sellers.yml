name: Sync Community Sellers

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Seller Sync Pipeline
        run: |
          python3 scripts/sync_all_community_sellers.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "ScentTwin Bot"
          git config --global user.email "bot@scenttwin.com"
          git add src/data/fragrances.json src/data/sync_meta.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync community seller prices from Google Sheets" && git push)
